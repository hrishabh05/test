apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
        - name: test-app
          image: REGION-docker.pkg.dev/PROJECT-ID/REPO-NAME/test-app:latest
          ports:
            - containerPort: 80

