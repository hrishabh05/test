name: CI - Build and Update Deployment

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: test-app
  GAR_LOCATION: asia-east1-docker.pkg.dev 
  PROJECT_ID: rs-0123
  GAR_REPO: kyoskdemo

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          docker build -t $GAR_LOCATION/$PROJECT_ID/$GAR_REPO/$IMAGE_NAME:${{ steps.vars.outputs.sha_short }} .
          docker push $GAR_LOCATION/$PROJECT_ID/$GAR_REPO/$IMAGE_NAME:${{ steps.vars.outputs.sha_short }}

      - name: Update deployment.yaml
        run: |
          sed -i "s|image: .*|image: $GAR_LOCATION/$PROJECT_ID/$GAR_REPO/$IMAGE_NAME:${{ steps.vars.outputs.sha_short }}|" deployment.yaml

      - name: Commit updated deployment.yaml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git commit -m "Update image tag to ${{ steps.vars.outputs.sha_short }}"
          git push

